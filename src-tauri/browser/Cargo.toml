[package]
name = "browser"
version = "0.1.0"
edition = "2021"

[lib]
name = "browser"
path = "src/lib.rs"

[dependencies]
app = { path = "../app" }
anyhow = "1.0.94"
directories = "5.0.1"
log = "0.4.22"
regex = "1.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.133"
tauri = { version = "1", features = [ "updater", "api-all", "devtools"] }
tokio = { version = "1", features = ["full"] }
ureq = "2.12.1"
walkdir = "2.5.0"
which = "7.0.0"
